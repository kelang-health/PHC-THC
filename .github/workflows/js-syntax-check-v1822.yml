name: JS syntax check v1.8.22
on:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check community modules
        run: |
          node --check community-gis-v1822.mjs
          node --check community-workflow-v1822.mjs
          node --check config.js
